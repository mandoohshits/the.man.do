<body>

<div class="noise"></div>
<div id="progressBar"></div>
<div id="chapterLabel"></div>

<div id="storyScreen">
  <div id="storyText"></div>
  <div id="tapHint">tap to continue</div>
</div>

<button id="skipBtn" onclick="skipStory()">SKIP →</button>

<div id="endScreen">
  <div class="end-logo">THE.MAN.DO</div>
  <div class="end-sub">[ OWNERSHIP IS A HABIT ]</div>
  <a href="index.html" class="enter-btn">ENTER THE UNIVERSE →</a>
</div>

<script>
// ══════════════════════════════════════════════════════
// THE STORY — chapters play one after another
// Each chapter has lines that type out word by word
// style: 'normal' | 'accent' | 'small' | 'big'
// pause: ms to wait after chapter finishes before auto-advancing
// ══════════════════════════════════════════════════════
const CHAPTERS = [
  {
    label: '001 — THE NAME',
    lines: [
      { text: 'My name is Amaljith.', style: 'normal' },
      { text: 'But nobody calls me that.', style: 'normal' },
    ],
    pause: 1800,
  },
  {
    label: '001 — THE NAME',
    lines: [
      { text: 'Somewhere along the way,', style: 'small' },
      { text: 'MANDOOH.', style: 'big' },
      { text: 'In my village, that word means a ghost.', style: 'normal' },
      { text: 'A child hunter.', style: 'accent' },
    ],
    pause: 2000,
  },
  {
    label: '001 — THE NAME',
    lines: [
      { text: 'I know. Funny, right?', style: 'normal' },
      { text: 'I was embarrassed by it for a long time.', style: 'normal' },
      { text: 'Now it\'s my identity.', style: 'accent' },
    ],
    pause: 2200,
  },
  {
    label: '002 — WHY THIS EXISTS',
    lines: [
      { text: 'I built this because...', style: 'small' },
      { text: 'I don\'t really know why I built this.', style: 'normal' },
    ],
    pause: 1600,
  },
  {
    label: '002 — WHY THIS EXISTS',
    lines: [
      { text: 'Maybe to help someone.', style: 'normal' },
      { text: 'Maybe to show what I can do.', style: 'normal' },
      { text: 'Maybe just to prove I exist', style: 'normal' },
      { text: 'outside of someone else\'s feed.', style: 'accent' },
    ],
    pause: 2200,
  },
  {
    label: '003 — WHO I AM',
    lines: [
      { text: 'I\'m just a normal person.', style: 'normal' },
      { text: 'Like everyone.', style: 'small' },
      { text: 'But I love this world a lot.', style: 'accent' },
    ],
    pause: 2000,
  },
  {
    label: '003 — WHO I AM',
    lines: [
      { text: 'No algorithm owns that.', style: 'normal' },
      { text: 'No feed filters it.', style: 'normal' },
      { text: 'No one decides what I show', style: 'normal' },
      { text: 'except me.', style: 'accent' },
    ],
    pause: 2000,
  },
  {
    label: '004 — AND THEN',
    lines: [
      { text: 'And then — meet Irappi.', style: 'normal' },
      { text: 'Don\'t ask who that is.', style: 'small' },
      { text: 'That\'s it.', style: 'accent' },
      { text: 'That\'s the whole story.', style: 'normal' },
    ],
    pause: 2500,
  },
  {
    label: '005 — THE UNIVERSE',
    lines: [
      { text: 'This is THE.MAN.DO.', style: 'big' },
      { text: 'A universe built by one person.', style: 'normal' },
      { text: 'No noise. No follow. No filter.', style: 'accent' },
      { text: 'Just real.', style: 'normal' },
    ],
    pause: 3000,
  },
];

// ── STATE ─────────────────────────────────────────
let currentChapter = 0;
let isTyping       = false;
let skipChapter    = false;
let storyDone      = false;

// ── TYPING ENGINE ─────────────────────────────────
function typeWords(element, text, speed, onDone) {
  const words = text.split(' ');
  let i = 0;
  element.textContent = '';

  function next() {
    if (skipChapter) {
      element.textContent = text;
      onDone && onDone();
      return;
    }
    if (i < words.length) {
      element.textContent += (i === 0 ? '' : ' ') + words[i];
      i++;
      setTimeout(next, speed + Math.random() * 40);
    } else {
      onDone && onDone();
    }
  }
  next();
}

// ── RENDER CHAPTER ────────────────────────────────
function renderChapter(idx) {
  if (idx >= CHAPTERS.length) {
    finishStory();
    return;
  }

  const ch    = CHAPTERS[idx];
  const el    = document.getElementById('storyText');
  const label = document.getElementById('chapterLabel');
  const hint  = document.getElementById('tapHint');
  const prog  = document.getElementById('progressBar');

  hint.classList.remove('show');
  skipChapter = false;
  isTyping    = true;

  // Update label + progress
  label.textContent = ch.label;
  prog.style.width  = ((idx + 1) / CHAPTERS.length * 100) + '%';

  // Fade out old content
  el.classList.add('fade-out');

  setTimeout(() => {
    el.innerHTML = '';
    el.classList.remove('fade-out');

    // Build line elements
    const lineEls = ch.lines.map(l => {
      const span = document.createElement('span');
      span.className = 'story-line' + (l.style !== 'normal' ? ' ' + l.style : '');
      el.appendChild(span);
      return { el: span, text: l.text };
    });

    // Type lines sequentially
    let lineIdx = 0;
    const cursor = document.createElement('span');
    cursor.className = 'blink-cursor';

    function typeNextLine() {
      if (lineIdx >= lineEls.length) {
        // All lines done
        isTyping = false;
        hint.classList.add('show');

        // Auto advance after pause
        setTimeout(() => {
          if (!storyDone) {
            currentChapter++;
            renderChapter(currentChapter);
          }
        }, ch.pause);
        return;
      }

      const current = lineEls[lineIdx];

      // Add cursor to current line while typing
      current.el.appendChild(cursor);

      const speed = current.el.classList.contains('big') ? 60 :
                    current.el.classList.contains('small') ? 50 : 55;

      typeWords(current.el, current.text, speed, () => {
        // Remove cursor from this line
        if (cursor.parentNode === current.el) current.el.removeChild(cursor);
        lineIdx++;
        setTimeout(typeNextLine, 180);
      });
    }

    typeNextLine();
  }, 400);
}

// ── TAP TO SKIP CHAPTER ───────────────────────────
document.getElementById('storyScreen').addEventListener('click', () => {
  if (isTyping) {
    skipChapter = true; // finish typing instantly
  } else {
    // Already done typing — advance now
    clearTimeout(); // won't cancel the specific one but that's ok
    currentChapter++;
    renderChapter(currentChapter);
  }
});

// ── FINISH ────────────────────────────────────────
function finishStory() {
  storyDone = true;
  const story = document.getElementById('storyScreen');
  const end   = document.getElementById('endScreen');
  const skip  = document.getElementById('skipBtn');
  const hint  = document.getElementById('tapHint');
  const prog  = document.getElementById('progressBar');

  hint.classList.remove('show');
  skip.style.display = 'none';
  prog.style.width = '100%';

  story.style.transition = 'opacity 0.8s';
  story.style.opacity = '0';

  setTimeout(() => {
    story.style.display = 'none';
    end.style.display = 'flex';
    setTimeout(() => end.classList.add('visible'), 50);
  }, 800);
}

// ── SKIP ALL ──────────────────────────────────────
function skipStory() {
  storyDone = true;
  skipChapter = true;
  finishStory();
}

// ── START ─────────────────────────────────────────
window.addEventListener('load', () => {
  setTimeout(() => renderChapter(0), 600);
});
</script>

</body>
