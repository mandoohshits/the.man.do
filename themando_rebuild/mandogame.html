<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANDO EATS</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#060606; font-family:'Space Mono',monospace; overflow:hidden; user-select:none; }
    #gameCanvas { display:block; }

    /* ── SCREENS ── */
    .screen {
      position:fixed; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:20px; z-index:20;
      background:#060606;
    }
    .screen.hidden { display:none; }

    .game-title { font-size:clamp(2.5rem,8vw,5rem); letter-spacing:10px; color:#f0ece0; line-height:1; }
    .game-sub   { font-size:0.55rem; letter-spacing:5px; color:rgba(240,160,20,0.5); text-transform:uppercase; }
    .game-desc  { font-size:0.65rem; letter-spacing:2px; color:rgba(240,236,224,0.25); text-align:center; line-height:2.2; text-transform:uppercase; }

    .diff-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px; }

    .diff-btn {
      padding:10px 22px;
      background:none;
      border:1px solid rgba(255,255,255,0.1);
      color:rgba(240,236,224,0.35);
      font-family:'Space Mono',monospace;
      font-size:0.58rem; letter-spacing:3px; text-transform:uppercase;
      cursor:pointer; transition:all 0.2s; border-radius:3px;
    }
    .diff-btn:hover { border-color:rgba(240,160,20,0.4); color:rgba(240,160,20,0.7); }
    .diff-btn.selected { background:rgba(240,160,20,0.1); border-color:#f0a014; color:#f0a014; }

    .diff-btn[data-diff="hard"]       { border-color:rgba(220,120,0,0.3); }
    .diff-btn[data-diff="impossible"] { border-color:rgba(220,50,50,0.3); color:rgba(220,50,50,0.4); }
    .diff-btn[data-diff="impossible"]:hover { border-color:rgba(220,50,50,0.8); color:rgba(220,50,50,0.9); }
    .diff-btn[data-diff="impossible"].selected { background:rgba(220,50,50,0.1); border-color:#e74c3c; color:#e74c3c; }

    .start-btn {
      padding:12px 40px; background:none;
      border:1px solid rgba(240,160,20,0.4); color:#f0a014;
      font-family:'Space Mono',monospace; font-size:0.65rem;
      letter-spacing:4px; text-transform:uppercase;
      cursor:pointer; transition:all 0.2s;
    }
    .start-btn:hover { background:rgba(240,160,20,0.08); border-color:#f0a014; }

    .controls-hint { font-size:0.45rem; letter-spacing:3px; color:rgba(240,236,224,0.12); text-transform:uppercase; text-align:center; line-height:2.5; }

    /* ── HUD ── */
    #hud {
      position:fixed; top:0; left:0; right:0;
      padding:14px 20px;
      display:none;
      justify-content:space-between;
      align-items:flex-start;
      z-index:10; pointer-events:none;
    }
    #hud.show { display:flex; }

    .hud-label { font-size:0.45rem; letter-spacing:4px; color:rgba(240,160,20,0.4); text-transform:uppercase; margin-bottom:4px; }
    .hud-val   { font-size:1.2rem; letter-spacing:2px; color:#f0a014; }
    .hud-wave  { font-size:0.8rem; letter-spacing:2px; color:rgba(240,236,224,0.4); }

    #dangerFlash {
      position:fixed; inset:0; z-index:15;
      background:rgba(220,50,50,0);
      pointer-events:none;
      transition:background 0.1s;
    }
    #dangerFlash.flash { background:rgba(220,50,50,0.25); }

    #gameOverScreen { background:rgba(6,6,6,0.97); }
    .go-title  { font-size:clamp(2rem,6vw,4rem); letter-spacing:6px; color:#f0ece0; }
    .go-score  { font-size:0.6rem; letter-spacing:4px; color:rgba(240,160,20,0.5); text-transform:uppercase; }
    .go-score span { color:#f0a014; font-size:1.1rem; }
    .go-eaten  { font-size:0.5rem; letter-spacing:2px; color:rgba(240,236,224,0.2); text-align:center; line-height:2.5; text-transform:uppercase; max-width:400px; }
    .go-wave   { font-size:0.55rem; letter-spacing:3px; color:rgba(240,160,20,0.4); text-transform:uppercase; }

    #waveAnnounce {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%);
      font-size:clamp(1.5rem,5vw,3rem);
      letter-spacing:8px; color:#f0ece0;
      text-transform:uppercase;
      opacity:0; z-index:18; pointer-events:none;
      transition:opacity 0.3s;
      text-align:center;
    }
    #waveAnnounce.show { opacity:1; }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="dangerFlash"></div>
<div id="waveAnnounce"></div>

<!-- HUD -->
<div id="hud">
  <div>
    <div class="hud-label">score</div>
    <div class="hud-val" id="scoreDisplay">0</div>
  </div>
  <div style="text-align:center;">
    <div class="hud-label">wave</div>
    <div class="hud-wave" id="waveDisplay">1</div>
  </div>
  <div style="text-align:right;">
    <div class="hud-label">lives</div>
    <div class="hud-val" id="livesDisplay">💀💀💀</div>
  </div>
</div>

<!-- START SCREEN -->
<div class="screen" id="startScreen">
  <div class="game-title">MANDO<br>EATS</div>
  <div class="game-sub">a mandolab production</div>
  <div class="game-desc">
    eat the people. avoid red enemies.<br>
    touch the skeleton exit to advance!
  </div>

  <div style="text-align:center;">
    <div class="hud-label" style="margin-bottom:10px;">select difficulty</div>
    <div class="diff-row">
      <button class="diff-btn selected" data-diff="easy"       onclick="selectDiff(this)">Easy</button>
      <button class="diff-btn"          data-diff="medium"     onclick="selectDiff(this)">Medium</button>
      <button class="diff-btn"          data-diff="hard"       onclick="selectDiff(this)">Hard</button>
      <button class="diff-btn"          data-diff="impossible" onclick="selectDiff(this)">Impossible</button>
    </div>
  </div>

  <button class="start-btn" onclick="startGame()">START EATING →</button>

  <div class="controls-hint">
    desktop: arrow keys / wasd · mouse click to move<br>
    mobile: tap where you want to go
  </div>
</div>

<!-- GAME OVER -->
<div class="screen hidden" id="gameOverScreen">
  <div class="go-title">GAME OVER</div>
  <div class="go-wave">reached wave <span id="finalWave">1</span></div>
  <div class="go-score">you ate <span id="finalScore">0</span> people</div>
  <div class="go-eaten" id="eatenList"></div>
  <button class="start-btn" onclick="restartGame()">EAT AGAIN →</button>
  <button class="start-btn" style="border-color:rgba(255,255,255,0.1);color:rgba(240,236,224,0.3);margin-top:-10px;" onclick="goMenu()">CHANGE DIFFICULTY</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

const PEOPLE_DATA = [
  { name:'Mandooh',  emoji:'😎', color:'#3498db', face:'photos/lab/mandogame/amal.png'},
  { name:'IRAPPI',   emoji:'🤪', color:'#9b59b6', face:'photos/lab/mandogame/irappi.png' },
  { name:'ummi',     emoji:'👩', color:'#e91e63', face:'photos/lab/mandogame/ummi.png' },
  { name:'jaggz',    emoji:'👨', color:'#2196f3', face:'photos/lab/mandogame/jaggz.png' },
  { name:'arth',     emoji:'🤙', color:'#4caf50', face:'photos/lab/mandogame/arth.png' },
  { name:'kurus',    emoji:'😤', color:'#ff9800', face:'photos/lab/mandogame/kurus.png' },
  { name:'NAOMI',    emoji:'🤖', color:'#00bcd4', face:'photos/lab/mandogame/meow.png' },
];

const DIFF = {
  easy:       { playerSpeed:7,  runSpeed:0.8,  detectRange:60,  redChance:0.1, wavePeople:4, waveGap:180, label:'EASY' },
  medium:     { playerSpeed:6,  runSpeed:1.4,  detectRange:90,  redChance:0.2, wavePeople:5, waveGap:140, label:'MEDIUM' },
  hard:       { playerSpeed:5,  runSpeed:2.0,  detectRange:110, redChance:0.3, wavePeople:6, waveGap:100, label:'HARD' },
  impossible: { playerSpeed:4,  runSpeed:3.0,  detectRange:150, redChance:0.4, wavePeople:8, waveGap:70,  label:'IMPOSSIBLE' },
};

let selectedDiff = 'easy';
let cfg = DIFF[selectedDiff];

let W, H, player, people, score, lives, wave, gameActive;
let waveTimer, waveSpawning, peopleThisWave, peopleSpawned;
let eatenNames = [], keys = {}, touchTarget = null;
let particles = [];

let levelExit = null; // Skeleton Exit portal

const faceImgs = {};
PEOPLE_DATA.forEach(p => {
  if (p.face) {
    const img = new Image();
    img.src = p.face;
    faceImgs[p.name] = img;
  }
});

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

function selectDiff(btn) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedDiff = btn.dataset.diff;
  cfg = DIFF[selectedDiff];
}

function createPlayer() {
  return { x:W/2, y:H/2, size:26, speed:cfg.playerSpeed, vx:0, vy:0, mouthOpen:0, mouthDir:1, legAnim:0 };
}

function spawnPerson(isRed) {
  let x, y, tries=0;
  do {
    x = 80 + Math.random()*(W-160);
    y = 80 + Math.random()*(H-160);
    tries++;
  } while (player && Math.hypot(x-player.x, y-player.y) < 180 && tries < 20);

  const t = PEOPLE_DATA[Math.floor(Math.random()*PEOPLE_DATA.length)];
  return {
    x, y,
    name:    isRed ? '⚠ '+t.name : t.name,
    rawName: t.name,
    emoji:   t.emoji,
    color:   isRed ? '#e74c3c' : t.color,
    face:    isRed ? null : t.face,
    speed:   cfg.runSpeed + Math.random()*0.5,
    size:    20,
    legAnim: Math.random()*Math.PI*2,
    isRed,
    aliveTime: 0,
  };
}

function spawnSkeletonExit() {
  levelExit = {
    x: 100 + Math.random()*(W-200),
    y: 100 + Math.random()*(H-200),
    size: 24
  };
}

function drawBg() {
  ctx.strokeStyle = 'rgba(240,160,20,0.04)';
  ctx.lineWidth = 0.5;
  for (let x=0; x<W; x+=60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<H; y+=60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  p.mouthOpen += 0.15*p.mouthDir;
  if (p.mouthOpen>0.4||p.mouthOpen<0) p.mouthDir*=-1;

  ctx.fillStyle = '#f0ece0';
  ctx.beginPath(); ctx.arc(0,0,p.size*0.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#060606';
  ctx.beginPath(); ctx.arc(-8,-4,5,0,Math.PI*2); ctx.arc(8,-4,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f0a014';
  ctx.beginPath(); ctx.arc(-8,-4,2.5,0,Math.PI*2); ctx.arc(8,-4,2.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#060606'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,6,7,p.mouthOpen,Math.PI-p.mouthOpen); ctx.stroke();
  p.legAnim+=0.12;
  ctx.strokeStyle='#f0ece0'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(0,p.size*0.6); ctx.lineTo(0,p.size*1.8); ctx.stroke();
  for(let i=0;i<3;i++){
    const ry=p.size*0.75+i*8;
    ctx.beginPath();
    ctx.moveTo(0,ry); ctx.bezierCurveTo(-14,ry-3,-16,ry+5,-7,ry+7);
    ctx.moveTo(0,ry); ctx.bezierCurveTo(14,ry-3,16,ry+5,7,ry+7);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(0,p.size*0.8); ctx.lineTo(-18+Math.sin(p.legAnim)*7,p.size*1.3+Math.cos(p.legAnim)*5);
  ctx.moveTo(0,p.size*0.8); ctx.lineTo(18+Math.sin(p.legAnim+Math.PI)*7,p.size*1.3+Math.cos(p.legAnim+Math.PI)*5);
  ctx.moveTo(0,p.size*1.8); ctx.lineTo(-11+Math.sin(p.legAnim+1)*9,p.size*2.6);
  ctx.moveTo(0,p.size*1.8); ctx.lineTo(11+Math.sin(p.legAnim+Math.PI+1)*9,p.size*2.6);
  ctx.stroke();
  ctx.restore();
}

function drawSkeletonExit(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.font = '28px serif';
  ctx.textAlign = 'center';
  ctx.fillText('💀', 0, 10);
  ctx.font = 'bold 9px Space Mono';
  ctx.fillStyle = '#2ecc71';
  ctx.fillText('NEXT LEVEL', 0, -20);
  ctx.restore();
}

function drawPerson(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  p.legAnim += 0.15;

  if (p.isRed) {
    ctx.shadowColor = '#e74c3c';
    ctx.shadowBlur  = 18 + Math.sin(Date.now()*0.008)*8;
  }

  ctx.shadowBlur = p.isRed ? 10 : 0;
  ctx.font = 'bold 8px Space Mono';
  ctx.fillStyle = p.isRed ? 'rgba(220,50,50,0.9)' : 'rgba(240,160,20,0.7)';
  ctx.textAlign = 'center';
  ctx.fillText(p.name, 0, -p.size-10);

  const faceImg = faceImgs[p.rawName];
  if (!p.isRed && faceImg && faceImg.complete && faceImg.naturalWidth>0) {
    const r = p.size*0.7;
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
    ctx.drawImage(faceImg,-r,-r,r*2,r*2);
    ctx.restore();
    ctx.strokeStyle = p.color; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  } else {
    ctx.font = `${p.size*1.1}px serif`;
    ctx.textAlign='center';
    if (p.isRed) ctx.fillText('👹',0,p.size*0.4);
    else ctx.fillText(p.emoji,0,p.size*0.4);
  }

  ctx.strokeStyle = p.color; ctx.lineWidth=2.5; ctx.shadowBlur=0;
  ctx.beginPath();
  ctx.moveTo(0,p.size*0.6); ctx.lineTo(0,p.size*1.6);
  ctx.moveTo(0,p.size*0.9); ctx.lineTo(-13+Math.sin(p.legAnim)*5,p.size*1.3);
  ctx.moveTo(0,p.size*0.9); ctx.lineTo(13+Math.sin(p.legAnim+Math.PI)*5,p.size*1.3);
  ctx.moveTo(0,p.size*1.6); ctx.lineTo(-9+Math.sin(p.legAnim+1)*7,p.size*2.3);
  ctx.moveTo(0,p.size*1.6); ctx.lineTo(9+Math.sin(p.legAnim+Math.PI+1)*7,p.size*2.3);
  ctx.stroke();

  ctx.restore();
}

function burst(x, y, color, text) {
  for(let i=0;i<10;i++){
    const a=(Math.PI*2/10)*i;
    particles.push({x,y,vx:Math.cos(a)*(2+Math.random()*4),vy:Math.sin(a)*(2+Math.random()*4),life:40,maxLife:40,color,size:3+Math.random()*3});
  }
  particles.push({x,y:y-20,vx:0,vy:-1.5,life:55,maxLife:55,text,color:'#f0a014',size:14,isText:true});
}

function drawParticles(){
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.life--;
    ctx.globalAlpha=p.life/p.maxLife;
    if(p.isText){ ctx.font=`bold ${p.size}px Space Mono`; ctx.fillStyle=p.color; ctx.textAlign='center'; ctx.fillText(p.text,p.x,p.y); }
    else{ ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
  });
}

function startWave() {
  waveSpawning   = true;
  peopleThisWave = cfg.wavePeople + (wave-1)*2;
  peopleSpawned  = 0;
  waveTimer      = 0;
  levelExit      = null;

  showWaveAnnounce();
}

function showWaveAnnounce() {
  const el = document.getElementById('waveAnnounce');
  el.innerHTML = `WAVE ${wave}<br><span style="font-size:0.5em;letter-spacing:4px;color:rgba(240,160,20,0.5)">EAT ALL & FIND EXIT</span>`;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2000);
  document.getElementById('waveDisplay').textContent = wave;
}

function update() {
  if (!gameActive) return;

  if (touchTarget) {
    const dx=touchTarget.x-player.x, dy=touchTarget.y-player.y;
    const d=Math.hypot(dx,dy);
    if(d>6){ player.x+=dx/d*player.speed; player.y+=dy/d*player.speed; }
    else touchTarget = null;
  } else {
    if(keys['ArrowLeft'] ||keys['a']||keys['A']) player.x-=player.speed;
    if(keys['ArrowRight']||keys['d']||keys['D']) player.x+=player.speed;
    if(keys['ArrowUp']   ||keys['w']||keys['W']) player.y-=player.speed;
    if(keys['ArrowDown'] ||keys['s']||keys['S']) player.y+=player.speed;
  }
  player.x=Math.max(25,Math.min(W-25,player.x));
  player.y=Math.max(25,Math.min(H-25,player.y));

  // SPAWN PEOPLE
  if (waveSpawning) {
    waveTimer++;
    if (waveTimer % cfg.waveGap === 0 && peopleSpawned < peopleThisWave) {
      const isRed = Math.random() < cfg.redChance;
      people.push(spawnPerson(isRed));
      peopleSpawned++;
      if (peopleSpawned >= peopleThisWave) waveSpawning = false;
    }
  }

  // MOVE PEOPLE
  people.forEach(p => {
    const dx=p.x-player.x, dy=p.y-player.y;
    const dist=Math.hypot(dx,dy);
    if (p.isRed) {
      p.x -= (dx/dist)*p.speed*1.8;
      p.y -= (dy/dist)*p.speed*1.8;
    } else if (dist < cfg.detectRange) {
      p.x += (dx/dist)*p.speed*1.5;
      p.y += (dy/dist)*p.speed*1.5;
    } else {
      p.x += (Math.random()-0.5)*1;
      p.y += (Math.random()-0.5)*1;
    }
  });

  // CHECK COLLISIONS
  const survived = [];
  for (const p of people) {
    const dist = Math.hypot(p.x-player.x, p.y-player.y);
    if (dist < player.size + p.size + 8) {
      if (p.isRed) {
        lives--;
        updateLives();
        burst(player.x, player.y, '#e74c3c', 'OUCH!');
        document.getElementById('dangerFlash').classList.add('flash');
        setTimeout(()=>document.getElementById('dangerFlash').classList.remove('flash'),150);
        if (lives<=0) { gameOver(); return; }
      } else {
        score += wave*10;
        eatenNames.push(p.rawName);
        burst(p.x, p.y, p.color, 'NOM!');
        document.getElementById('scoreDisplay').textContent = score;
      }
    } else {
      survived.push(p);
    }
  }
  people = survived;

  // EXIT LEVEL CHECK (Skeleton Gate)
  if (!waveSpawning && people.length === 0 && !levelExit) {
    spawnSkeletonExit();
  }

  if (levelExit) {
    const exitDist = Math.hypot(levelExit.x - player.x, levelExit.y - player.y);
    if (exitDist < player.size + levelExit.size) {
      burst(player.x, player.y, '#2ecc71', 'NEXT LEVEL!');
      wave++;
      startWave();
    }
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  drawBg();
  if (levelExit) drawSkeletonExit(levelExit);
  people.forEach(drawPerson);
  drawPlayer(player);
  drawParticles();
}

function tick() {
  update(); draw();
  if (gameActive) requestAnimationFrame(tick);
}

function updateLives() {
  document.getElementById('livesDisplay').textContent = '💀'.repeat(Math.max(0,lives));
}

function startGame() {
  cfg = DIFF[selectedDiff];
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('hud').classList.add('show');

  player=createPlayer(); people=[]; score=0; lives=3;
  wave=1; eatenNames=[]; particles=[]; levelExit=null;
  gameActive=true;

  document.getElementById('scoreDisplay').textContent='0';
  updateLives();
  startWave();
  requestAnimationFrame(tick);
}

function restartGame() {
  document.getElementById('gameOverScreen').classList.add('hidden');
  startGame();
}

function goMenu() {
  gameActive=false;
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('startScreen').classList.remove('hidden');
}

function gameOver() {
  gameActive=false;
  document.getElementById('hud').classList.remove('show');
  document.getElementById('finalScore').textContent=score;
  document.getElementById('finalWave').textContent=wave;
  const unique=[...new Set(eatenNames)];
  document.getElementById('eatenList').textContent = unique.length
    ? 'eaten: '+unique.join(', ')
    : 'you ate nobody...';
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

window.addEventListener('keydown',e=>{keys[e.key]=true;});
window.addEventListener('keyup',  e=>{keys[e.key]=false;});

canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];touchTarget={x:t.clientX,y:t.clientY};},{passive:false});
canvas.addEventListener('touchmove', e=>{e.preventDefault();const t=e.touches[0];touchTarget={x:t.clientX,y:t.clientY};},{passive:false});
canvas.addEventListener('touchend', ()=>{touchTarget=null;});
canvas.addEventListener('click',e=>{if(gameActive){touchTarget={x:e.clientX,y:e.clientY};}});
</script>
</body>
</html>
