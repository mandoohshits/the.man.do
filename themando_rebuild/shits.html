═══════════════════════════════════════════════════
RIDDLE UNLOCK WIDGET
Copy this block and paste it inside any photo-cell,
lab card, or anywhere on the site.

To customize:
- Change data-answer to your answer (lowercase)
- Change the riddle text
- Change the quote inside .unlocked-quote

<style>
.riddle-box {
  margin: 20px 0;
  padding: 22px 24px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}

.riddle-box.unlocked-state {
  border-color: rgba(240,160,20,0.3);
}

/* LOCKED */
.riddle-locked {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.riddle-box.unlocked-state .riddle-locked { display: none; }

.riddle-icon {
  font-family: 'Space Mono', monospace;
  font-size: 1.2rem;
  color: rgba(240,160,20,0.3);
  line-height: 1;
}

.riddle-question {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 2px;
  color: rgba(240,236,224,0.5);
  text-transform: uppercase;
  line-height: 1.6;
}

.riddle-input-wrap {
  display: flex;
  gap: 8px;
  align-items: center;
}

.riddle-input {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  padding: 8px 12px;
  color: #f0ece0;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 2px;
  outline: none;
  transition: border-color 0.2s;
}

.riddle-input:focus { border-color: rgba(240,160,20,0.3); }
.riddle-input::placeholder { color: rgba(240,236,224,0.15); }

.riddle-submit {
  background: none;
  border: 1px solid rgba(240,160,20,0.25);
  border-radius: 4px;
  padding: 8px 14px;
  color: #f0a014;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  cursor: pointer;
  transition: all 0.2s;
}

.riddle-submit:hover {
  background: rgba(240,160,20,0.08);
  border-color: #f0a014;
}

.riddle-wrong {
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 3px;
  color: rgba(220,80,60,0.6);
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.3s;
}

.riddle-wrong.show { opacity: 1; }

/* UNLOCKED */
.riddle-unlocked {
  display: none;
  flex-direction: column;
  gap: 12px;
  animation: revealQuote 0.6s ease forwards;
}

.riddle-box.unlocked-state .riddle-unlocked { display: flex; }

.unlock-line {
  font-family: 'Space Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 4px;
  color: rgba(240,160,20,0.4);
  text-transform: uppercase;
}

.unlocked-quote {
  font-family: 'DM Sans', sans-serif;
  font-size: 1.1rem;
  line-height: 1.7;
  color: #f0ece0;
  font-style: italic;
  font-weight: 300;
}

.unlock-sign {
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 3px;
  color: rgba(240,160,20,0.4);
}

@keyframes revealQuote {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>

<script>
function checkRiddle(btn) {
  const box    = btn.closest('.riddle-box');
  const input  = box.querySelector('.riddle-input');
  const wrong  = box.querySelector('.riddle-wrong');
  const answer = box.dataset.answer.toLowerCase().trim();
  const guess  = input.value.toLowerCase().trim();

  if (guess === answer) {
    box.classList.add('unlocked-state');
  } else {
    wrong.classList.add('show');
    input.value = '';
    input.focus();
    setTimeout(() => wrong.classList.remove('show'), 2000);
  }
}

// Also allow Enter key
document.querySelectorAll('.riddle-input').forEach(input => {
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      checkRiddle(input.nextElementSibling);
    }
  });
});

      .video-wrap.short.expanded { height: calc(60vw * 16/9); }

    .yt-player {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0; transition: opacity 0.4s;
      pointer-events: none;
    }

    .video-wrap.expanded .yt-player { pointer-events: all; opacity: 1; }

    .video-skeleton {
      position: absolute; inset: 0; background: #090909;
      display: flex; flex-direction: row; align-items: center;
      gap: 16px; padding: 0 20px; z-index: 10; transition: opacity 0.4s;
    }

    .video-wrap.expanded .video-skeleton { flex-direction:column; justify-content:center; padding:0; }

    .play-trigger {
      position: relative; z-index: 2;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(240,160,20,0.5);
      background: rgba(6,6,6,0.85);

      color: var(--accent); flex-shrink: 0;
      transition: transform 0.2s, background 0.2s;
    }

    .video-wrap.expanded .play-trigger { width:52px; height:52px; font-size:0.6rem; }
    .video-wrap:hover .play-trigger { background:rgba(240,160,20,0.15); transform:scale(1.1); }

    .skeleton-dots { position:relative; z-index:2; display:none; gap:4px; }
    .video-skeleton.loading .skeleton-dots { display:flex; }
    .video-skeleton.loading .play-trigger  { display:none; }

    .skeleton-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); }
    .video-skeleton.loading .skeleton-dot:nth-child(1){ animation:dotPulse 1s ease-in-out infinite 0s; }
    .video-skeleton.loading .skeleton-dot:nth-child(2){ animation:dotPulse 1s ease-in-out infinite 0.2s; }
    .video-skeleton.loading .skeleton-dot:nth-child(3){ animation:dotPulse 1s ease-in-out infinite 0.4s; }

      text-transform: uppercase; pointer-events: none;
    }

    .video-wrap.expanded .expand-hint { display:none; }

    /* Status bar */
    .video-status-bar {
      background: rgba(6,6,6,0.97);
      border: 1px solid rgba(255,255,255,0.07);

    .buf-dot {

    }

    .vsb-idle .buf-dot    { opacity:0.1; animation:none!important; }
    .vsb-idle .buf-text   { opacity:0.2; } .vsb-idle .play-text { opacity:0; } .vsb-idle .pause-text { opacity:0; } .vsb-idle .waveform-mini { opacity:0; }

    .vsb-buffering .buf-dot:nth-child(1){ animation:dotPulse 1s ease-in-out infinite 0s;   opacity:1; }
    .vsb-buffering .buf-dot:nth-child(2){ animation:dotPulse 1s ease-in-out infinite 0.2s; opacity:1; }

    .vsb-playing .buf-dot  { opacity:0.08; animation:none!important; }

    .vsb-paused .buf-dot   { opacity:0.08; animation:none!important; }
    .vsb-paused .buf-text  { opacity:0; } .vsb-paused .play-text { opacity:0; } .vsb-paused .pause-text { opacity:0.5; } .vsb-paused .waveform-mini { opacity:0; }

    .buf-text, .play-text, .pause-text {

<script>
// ══════════════════════════════════════════════
// PHOTOS — update these to match your content
// ══════════════════════════════════════════════
const PHOTOS = {
  1: { imgSrc:'photos/Shits/sh1.png', title:'Is everyone is mirror of myself', date:'2024', location:'Dubai', letter:'If reality is purely a reflection of my inner state, then the external universe doesn\'t actually exist on its own—it is just a massive, interactive projector broadcasting my subconscious thoughts back to me.', sign:'— M' },
  2: { imgSrc:'images/shits/photo2.jpg', title:'TITLE', date:'2024', location:'UAE',   letter:'Write your letter here.', sign:'— M' },
  3: { imgSrc:'images/shits/photo3.jpg', title:'TITLE', date:'2024', location:'UAE',   letter:'Write your letter here.', sign:'— M' },
  4: { imgSrc:'images/shits/photo4.jpg', title:'TITLE', date:'2024', location:'UAE',   letter:'Write your letter here.', sign:'— M' },
  5: { imgSrc:'images/shits/photo5.jpg', title:'TITLE', date:'2024', location:'UAE',   letter:'Write your letter here.', sign:'— M' },
  6: { imgSrc:'images/shits/photo6.jpg', title:'TITLE', date:'2024', location:'UAE',   letter:'Write your letter here.', sign:'— M' },
};

function openPhoto(id) {
  const data = PHOTOS[id];
  if (!data) return;
  const lbPhoto = document.getElementById('lbPhoto');
  lbPhoto.innerHTML = data.imgSrc
    ? `<img src="${data.imgSrc}" alt="${data.title}">`
    : `<div class="lb-placeholder">${data.title}</div>`;
  document.getElementById('lbFrom').textContent  = 'FROM — THE.MAN.DO';
  document.getElementById('lbDate').textContent  = data.date + ' · ' + data.location;
  document.getElementById('lbTitle').textContent = data.title;
  document.getElementById('lbBody').textContent  = data.letter;
  document.getElementById('lbSign').textContent  = data.sign;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(e) {
  if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lb-close')) return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; }
});

// ══════════════════════════════════════════════
// VIDEOS — add your YouTube IDs here
// ══════════════════════════════════════════════
const VIDEO_LIST = [
  { playerId:'yt-1', videoId:'ZmMQv3IzdAg', wrapId:'wrap-1', skelId:'skel-1', barId:'bar-1' },
  { playerId:'yt-2', videoId:'-hoRj5SZyBM', wrapId:'wrap-2', skelId:'skel-2', barId:'bar-2',
    embedUrl:'https://www.youtube.com/embed/-hoRj5SZyBM?enablejsapi=1&controls=1&rel=0&playsinline=1' },
  // ADD MORE: { playerId:'yt-3', videoId:'YOUR_ID', wrapId:'wrap-3', skelId:'skel-3', barId:'bar-3' },
];

const players = {};
const YT_STATE = { UNSTARTED:-1, ENDED:0, PLAYING:1, PAUSED:2, BUFFERING:3, CUED:5 };

function onYouTubeIframeAPIReady() {
  VIDEO_LIST.forEach(v => {
    const container = document.getElementById(v.playerId);
    if (!container) return;
    if (v.embedUrl) {
      const iframe = document.createElement('iframe');
      iframe.src = v.embedUrl;
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      iframe.allowFullscreen = true;
      iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;';
      container.appendChild(iframe);
      const wrap = document.getElementById(v.wrapId);
      if (wrap) { wrap._fallback = true; wrap._open = false; }
      setBar(v.barId, 'idle');
    } else {
      players[v.playerId] = new YT.Player(v.playerId, {
        videoId: v.videoId,
        playerVars: { autoplay:0, controls:1, modestbranding:1, rel:0, playsinline:1, fs:1 },
        events: {
          onReady:       () => setBar(v.barId, 'idle'),
          onStateChange: (e) => onStateChange(e, v),
        }
      });
    }
  });
}

function onStateChange(e, v) {
  const wrap = document.getElementById(v.wrapId);
  const skel = document.getElementById(v.skelId);
  const ytEl = document.getElementById(v.playerId);
  if (e.data === YT_STATE.BUFFERING) { setBar(v.barId, 'buffering'); }
  if (e.data === YT_STATE.PLAYING) {
    if (ytEl) ytEl.style.opacity = '1';
    if (skel) skel.classList.add('hidden');
    if (wrap) wrap.classList.add('expanded');
    setBar(v.barId, 'playing');
  }
  if (e.data === YT_STATE.PAUSED)  { if (wrap) wrap.classList.remove('expanded'); setBar(v.barId, 'paused'); }
  if (e.data === YT_STATE.ENDED)   { if (wrap) wrap.classList.remove('expanded'); setBar(v.barId, 'idle'); }
}

function handleClick(playerId, wrapId, skelId, barId) {
  const wrap = document.getElementById(wrapId);
  const skel = document.getElementById(skelId);
  if (wrap && wrap._fallback) {
    if (!wrap._open) {
      wrap._open = true; wrap.classList.add('expanded');
      const ytEl = document.getElementById(playerId);
      if (ytEl) ytEl.style.opacity = '1';
      if (skel) skel.classList.add('hidden');
      setBar(barId, 'playing');
    } else {
      wrap._open = false; wrap.classList.remove('expanded');
      setBar(barId, 'paused');
    }
    return;
  }
  const player = players[playerId];
  if (!player || typeof player.getPlayerState !== 'function') return;
  if (player.getPlayerState() === YT_STATE.PLAYING) {
    player.pauseVideo();
  } else {
    if (skel) skel.classList.add('loading');
    setBar(barId, 'buffering');
    player.unMute(); player.setVolume(100); player.playVideo();
  }
}

function setBar(barId, state) {
  const bar = document.getElementById(barId);
  if (bar) bar.className = 'video-status-bar vsb-' + state;
}

function toggleChat() {
  const box = document.getElementById('chatBox');
  const btn = document.getElementById('chatBtn');
  if (!box) return;
  box.classList.toggle('active');
  btn.textContent = box.classList.contains('active') ? 'CLOSE' : 'MSG';
}
</script>
